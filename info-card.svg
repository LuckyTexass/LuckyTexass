<svg xmlns="http://www.w3.org/2000/svg" width="860" height="412" viewBox="0 0 860 412" role="img" aria-label="neofetch">
  <style>
      .p { font: 14px ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace; fill: #39d353; }
      .k { font: 14px ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace; fill: #e6edf3; }
      .t { font: 12px ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace; fill: #7d8590; }
      .cmd { clip-path: inset(0 100% 0 0); animation: type 0.9s steps(8) .2s forwards; }
      @keyframes type { to { clip-path: inset(0 0 0 0); } }
      .cur { animation: blink 1s steps(1) infinite; }
      @keyframes blink { 50% { opacity: 0; } }
        
      .logo { font: 700 17px/1 ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace; white-space: pre; }
      .row { font: 13px ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace; }
      .u { fill: #39d353; font-weight: 700; }
      .d { fill: #c9d1d9; }
      .key { fill: #79c0ff; font-weight: 700; }
      .v { fill: #c9d1d9; }
    
      .wipe { clip-path: inset(0 100% 0 0); animation: wipe .5s steps(17) forwards; }
      @keyframes wipe { to { clip-path: inset(0 0 0 0); } }
      .row { opacity: 0; animation: rise .45s ease-out forwards; }
      @keyframes rise { from { opacity: 0; transform: translateX(-10px); } to { opacity: 1; transform: none; } }
        
  </style>
  <rect x=".5" y=".5" width="859" height="411" rx="10" fill="#0d1117" stroke="#30363d"/>
